name: Stable release

# Run on request (Actions tab > Stable release > Run workflow).
# Builds the current main on all three platforms, then publishes it as the latest release, using the notes in
# .github/release-notes/<version>.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0 (needs .github/release-notes/<version>.md)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/$VERSION.md"
          if [ ! -f "$notes" ]; then echo "::error::Missing release notes: $notes"; exit 1; fi
          mkdir out
          for os in linux macos windows; do
            (cd "art/VialSynth-$os-vst3" && zip -qr "../../out/VialSynth-$VERSION-$os-vst3.zip" .)
          done
          cp art/VialSynth-windows-installer/*.exe out/
          cp art/VialSynth-macos-installer/*.pkg out/
          ls -l out
          gh release create "v$VERSION" out/* --repo "$REPO" --target "${{ github.sha }}" \
            --title "VialSynth $VERSION" --notes-file "$notes" --latest
