name: Build VialSynth

# One workflow for every platform: the Linux, Windows and macOS VST3 builds of the synth. Run it from the Actions tab;
# the Nightly and Stable release workflows reuse it and publish its artifacts.
#
# The Windows (.exe) and macOS (.pkg) installers are built here too.
on:
  # Whole builds run only when asked for: from the Actions tab, from the Nightly release workflow, or from the Stable
  # release workflow. Pushes do not start them; use "Test build" for a quick portable build of a change.
  workflow_dispatch:
  workflow_call:

env:
  # clap-juce-extensions (MIT), the wrapper that turns the JUCE plugin into a CLAP. Pinned to a commit.
  CLAP_EXT_SHA: 6bde108329ff9fc24404b79b8b397261a75cf6a8

jobs:
  linux:
    name: Linux (VST3, CLAP, LV2, standalone)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libsecret and glib are linked by the Firebase libraries that ship in third_party.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfreetype6-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libsecret-1-dev libglib2.0-dev

      - name: Build VialSynth VST3
        run: |
          set +e
          make -C plugin/builds/linux_vst VST3 CONFIG=Release AR=gcc-ar \
            SIMDFLAGS="-msse2" GLFLAGS="" BUILD_DATE="$(date +'%Y %m %d %H %M')" > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the first errors as annotations so they are readable without the full log.
            grep -n -m 40 -E "error|undefined reference|No such file|\*\*\*" build.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -n -A14 -E "Undefined symbols|duplicate symbol|ld: " build.log | head -60 \
              | cut -c1-300 | while IFS= read -r line; do echo "::error::LD ${line}"; done
            echo "::error::last lines: $(tail -n 6 build.log | tr '\n' '|' | cut -c1-600)"
          fi
          exit $status

      - name: Check for Vital branding and service domains
        run: |
          set +e
          # The built plugin must not contain the original product's domains or author/company names.
          strings -a plugin/builds/linux_vst/build/VialSynth.vst3/Contents/x86_64-linux/VialSynth.so > binary_strings.txt
          if grep -i -n -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel" binary_strings.txt | head -20 > hits.txt && [ -s hits.txt ]; then
            while IFS= read -r l; do echo "::error::[binary] $l"; done < hits.txt
            exit 1
          fi
          # No first-party source/build file of the plugin (outside third_party, the licence files and copyright headers)
          # may reference them either.
          if grep -rIn -i -E "vital\.audio|vital audio|tytel\.org|matthewtytel" --exclude-dir=third_party --exclude-dir=.git \
               --exclude=LICENSE --exclude=NOTICE.md --exclude=copyright --exclude=changelog --exclude-dir=debian \
               src plugin Makefile README.md 2>/dev/null | grep -v -E "Copyright 20[0-9-]+ Matt Tytel" | head -20 > srchits.txt && [ -s srchits.txt ]; then
            while IFS= read -r l; do echo "::error::[source] $l"; done < srchits.txt
            exit 1
          fi
          echo "branding check passed"

      - name: Package
        run: |
          mkdir -p dist
          cp -r plugin/builds/linux_vst/build/VialSynth.vst3 dist/
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-linux-vst3
          path: dist

      - name: Build the CLAP
        run: |
          set -e
          VER=$(sed -n 's/.*kVialFxVersion = "\([^"]*\)".*/\1/p' src/interface/editor_sections/about_section.cpp | head -1)
          git init -q clap-ext
          git -C clap-ext remote add origin https://github.com/free-audio/clap-juce-extensions
          git -C clap-ext fetch -q --depth 1 origin "$CLAP_EXT_SHA"
          git -C clap-ext checkout -q FETCH_HEAD
          git -C clap-ext submodule update -q --init --depth 1 --recursive
          cmake -S plugin/clap -B clap-build -DCMAKE_BUILD_TYPE=Release \
            -DPATH_TO_CLAP_EXTENSIONS="$PWD/clap-ext" \
            -DVIALSYNTH_SHARED_LIB="$PWD/plugin/builds/linux_vst/build/VialSynth.a" -DVIALSYNTH_VERSION="$VER" 2>&1 | tail -30
          cmake --build clap-build --target VialSynth_CLAP -j"$(nproc)" 2>&1 | tail -60
          mkdir -p dist-clap
          cp clap-build/VialSynth_artefacts/Release/VialSynth.clap dist-clap/
          if strings -a dist-clap/VialSynth.clap | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the CLAP"; exit 1; fi
          ls -l dist-clap

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-linux-clap
          path: dist-clap

      - name: Build the LV2
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          # Reuses the objects and shared code library of the VST3 build; adds the LV2 wrapper bundled with JUCE.
          # The .ttl generator loads the plugin to read its ports, so it runs under a virtual display.
          xvfb-run -a make -C plugin/builds/linux_vst -f lv2.mk lv2 CONFIG=Release AR=gcc-ar \
            SIMDFLAGS="-msse2" GLFLAGS="" BUILD_DATE="$(date +'%Y %m %d %H %M')" > lv2.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error|undefined reference|No such file|\*\*\*" lv2.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 8 lv2.log | tr '\n' '|' | cut -c1-700)"
            exit $status
          fi
          mkdir -p dist-lv2
          cp -r plugin/builds/linux_vst/build/VialSynth.lv2 dist-lv2/
          ls -l dist-lv2/VialSynth.lv2
          if strings -a dist-lv2/VialSynth.lv2/VialSynth.so | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the LV2"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-linux-lv2
          path: dist-lv2

      - name: Build the standalone app
        run: |
          set +e
          make -C standalone/builds/linux CONFIG=Release AR=gcc-ar \
            SIMDFLAGS="-msse2" GLFLAGS="" BUILD_DATE="$(date +'%Y %m %d %H %M')" > standalone.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error|undefined reference|No such file|\*\*\*" standalone.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 8 standalone.log | tr '\n' '|' | cut -c1-700)"
            exit $status
          fi
          mkdir -p dist-app
          cp standalone/builds/linux/build/VialSynth dist-app/
          if strings -a dist-app/VialSynth | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the standalone"; exit 1; fi
          ls -l dist-app

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-linux-standalone
          path: dist-app

      - name: Validate with pluginval
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends xvfb unzip wget gdb libfreetype6 libasound2 libcurl4 libxrandr2 libxinerama1 libxcursor1
          wget -q https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval_Linux.zip
          PLUGIN=plugin/builds/linux_vst/build/VialSynth.vst3
          final=0

          # pluginval randomises parameter values, so run several fixed seeds. On a crash, rerun
          # the same seed under gdb to capture a backtrace and the last verbose output.
          run_mode() {
            mode=$1; extra=$2; level=$3
            for seed in 1 2 3 4 5 6; do
              xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process $extra --random-seed $seed \
                --output-dir "$PWD" "$PLUGIN" > val_${mode}_$seed.log 2>&1
              rc=$?
              echo "[$mode] seed $seed exit=$rc"
              if [ $rc -ne 0 ]; then
                if [ $rc -ge 128 ]; then
                  xvfb-run -a gdb -batch -ex "set pagination off" -ex run -ex "bt 30" \
                    --args ./pluginval --strictness-level 5 --validate-in-process $extra --verbose --random-seed $seed \
                    --output-dir "$PWD" "$PLUGIN" > gdb_${mode}_$seed.log 2>&1
                  grep -E "^#[0-9]+" gdb_${mode}_$seed.log | head -30 | cut -c1-330 | while IFS= read -r l; do echo "::$level::[$mode seed $seed bt] $l"; done
                  grep -B16 -m1 -E "SIGSEGV|Program received" gdb_${mode}_$seed.log | cut -c1-240 | tr '\n' '|' | cut -c1-1800 | while IFS= read -r l; do echo "::$level::[$mode seed $seed before-crash] $l"; done
                else
                  grep -i -E "fail|error|assert" val_${mode}_$seed.log | head -15 | cut -c1-300 | while IFS= read -r l; do echo "::$level::[$mode seed $seed] $l"; done
                fi
                return $rc
              fi
            done
            return 0
          }

          run_mode nogui "--skip-gui-tests" error
          final=$?
          run_mode gui "" warning
          exit $final

  windows:
    name: Windows (VST3, CLAP, standalone + installer)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CL: /bigobj
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build VialSynth VST3 (x64, Release)
        shell: pwsh
        run: |
          # Only the shared code and the VST3 are built: the solution also holds a VST2 and a standalone project, and the
          # VST2 one needs Steinberg's VST2 SDK, which is not public. The solution has no project dependencies, so the two
          # projects are built one after the other, with the solution directory set the way Visual Studio would set it.
          $sd = (Resolve-Path plugin\builds\vs17).Path + '\'
          $code = 0
          foreach ($proj in 'Vial_SharedCode', 'Vial_VST3') {
            msbuild "plugin\builds\vs17\$proj.vcxproj" /m /nologo /p:Configuration=Release /p:Platform=x64 `
              /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false "/p:SolutionDir=$sd" "/flp:logfile=msbuild.log;verbosity=minimal;append"
            $code = $LASTEXITCODE
            if ($code -ne 0) { break }
          }
          if ($code -ne 0) {
            # Surface the first compiler/linker errors as annotations (the full log is not downloadable here).
            Select-String -Path msbuild.log -Pattern ' error ' | Select-Object -Unique -First 40 |
              ForEach-Object { $t = $_.Line.Trim(); if ($t.Length -gt 450) { $t = $t.Substring(0,450) }; Write-Host "::error::$t" }
          }
          exit $code

      - name: Locate the plugin
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse plugin\builds\vs17 -Filter *.vst3 | Select-Object -First 1
          if (-not $f) { Write-Host "::error::no .vst3 produced"; exit 1 }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $f.FullName dist\
          Get-ChildItem dist | Format-Table Name, Length

      - name: Check for Vital branding and service domains
        shell: pwsh
        run: |
          python -c "import re,sys,glob; d=open(glob.glob('dist/*.vst3')[0],'rb').read(); m=re.findall(rb'(?i)vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel', d); print(m[:10]); sys.exit(1 if m else 0)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::[binary] Vital branding or service domain found in the plugin"; exit 1 }
          Write-Host "branding check passed"

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-windows-vst3
          path: dist

      - name: Build the CLAP
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/interface/editor_sections/about_section.cpp -Pattern 'kVialFxVersion = "([^"]+)"').Matches[0].Groups[1].Value
          git init -q clap-ext
          git -C clap-ext remote add origin https://github.com/free-audio/clap-juce-extensions
          git -C clap-ext fetch -q --depth 1 origin "$env:CLAP_EXT_SHA"
          git -C clap-ext checkout -q FETCH_HEAD
          git -C clap-ext submodule update -q --init --depth 1 --recursive
          cmake -S plugin\clap -B clap-build -G "Visual Studio 17 2022" -A x64 `
            "-DPATH_TO_CLAP_EXTENSIONS=$PWD\clap-ext" "-DVIALSYNTH_SHARED_LIB=$PWD\plugin\builds\vs17\x64\Release\Shared Code\VialSynth.lib" "-DVIALSYNTH_VERSION=$ver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build clap-build --config Release --target VialSynth_CLAP -- /m /nologo "/flp:logfile=clap.log;verbosity=minimal"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path clap.log -Pattern ' error ' | Select-Object -Unique -First 40 |
              ForEach-Object { $t = $_.Line.Trim(); if ($t.Length -gt 450) { $t = $t.Substring(0,450) }; Write-Host "::error::$t" }
            exit $code
          }
          New-Item -ItemType Directory dist-clap | Out-Null
          Copy-Item clap-build\VialSynth_artefacts\Release\VialSynth.clap dist-clap\
          python -c "import re,sys,glob; d=open(glob.glob('dist-clap/*.clap')[0],'rb').read(); m=re.findall(rb'(?i)vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel', d); print(m[:10]); sys.exit(1 if m else 0)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::[binary] Vital branding or service domain found in the CLAP"; exit 1 }
          Get-ChildItem dist-clap | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-windows-clap
          path: dist-clap

      - name: Build the standalone app (x64, Release)
        shell: pwsh
        run: |
          $sd = (Resolve-Path standalone\builds\vs17).Path + '\'
          msbuild "standalone\builds\vs17\Vial_App.vcxproj" /m /nologo /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false "/p:SolutionDir=$sd" "/flp:logfile=app.log;verbosity=minimal"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path app.log -Pattern ' error ' | Select-Object -Unique -First 40 |
              ForEach-Object { $t = $_.Line.Trim(); if ($t.Length -gt 450) { $t = $t.Substring(0,450) }; Write-Host "::error::$t" }
            exit $code
          }
          New-Item -ItemType Directory dist-app | Out-Null
          Copy-Item "standalone\builds\vs17\x64\Release\App\VialSynth.exe" dist-app\
          python -c "import re,sys; d=open('dist-app/VialSynth.exe','rb').read(); m=re.findall(rb'(?i)vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel', d); print(m[:10]); sys.exit(1 if m else 0)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::[binary] Vital branding or service domain found in the standalone"; exit 1 }
          Get-ChildItem dist-app | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-windows-standalone
          path: dist-app

      - name: Build the Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory installers | Out-Null
          $ver = (Select-String -Path src/interface/editor_sections/about_section.cpp -Pattern 'kVialFxVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceFile=$PWD\dist\VialSynth.vst3" "/DClapFile=$PWD\dist-clap\VialSynth.clap" "/DAppVersion=$ver" "/O$PWD\installers" installer\windows\VialSynth.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed"; exit 1 }
          Get-ChildItem installers | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-windows-installer
          path: installers

      - name: Validate with pluginval (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $plugin = (Get-ChildItem dist -Filter *.vst3 | Select-Object -First 1).FullName
          foreach ($seed in 1,2,3) {
            .\pv\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --random-seed $seed --output-dir $PWD $plugin *> "pv_$seed.log"
            $rc = $LASTEXITCODE
            Write-Host "seed $seed exit=$rc"
            if ($rc -ne 0) {
              Select-String -Path "pv_$seed.log" -Pattern 'fail|error|crash|assert' | Select-Object -First 15 |
                ForEach-Object { $t = $_.Line.Trim(); if ($t.Length -gt 300) { $t = $t.Substring(0,300) }; Write-Host "::warning::[pluginval seed $seed] $t" }
              exit $rc
            }
          }

  macos:
    name: macOS (VST3, CLAP, AU, standalone + installer)
    # The last Intel runner: the prebuilt Projucer of the JUCE version this project uses is an Intel binary. The plugin
    # itself is built universal (arm64 + x86_64).
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get Projucer (JUCE 6.0.5)
        run: |
          curl -fsSL -o juce.zip https://github.com/juce-framework/JUCE/releases/download/6.0.5/juce-6.0.5-osx.zip
          unzip -q juce.zip -d juce_download
          ls juce_download/JUCE

      - name: Generate the Xcode project
        run: |
          python3 - <<'EOF'
          import re
          p = 'plugin/vital.jucer'
          s = open(p).read()
          a = s.index('<XCODE_MAC')
          b = s.index('</XCODE_MAC>')
          block = s[a:b]
          # Authentication is compiled out (NO_AUTH), so the closed-source Firebase frameworks, the Kerberos library and
          # the original product's post-build step are not needed.
          for attr in ('extraCustomFrameworks', 'frameworkSearchPaths', 'externalLibraries', 'postbuildCommand',
                       'iosDevelopmentTeamID'):
              block = re.sub(r'\s+' + attr + r'="[^"]*"', '', block)
          block = block.replace('hardenedRuntime="1"', 'hardenedRuntime="0"')
          block = block.replace('enablePluginBinaryCopyStep="1"', 'enablePluginBinaryCopyStep="0"')
          block = block.replace('osxCompatibility="10.12 SDK"', 'osxCompatibility="10.13 SDK"')
          s = s[:a] + block + s[b:]
          open(p, 'w').write(s)
          EOF
          juce_download/JUCE/Projucer.app/Contents/MacOS/Projucer --resave plugin/vital.jucer
          ls plugin/builds/osx

      - name: Build VialSynth VST3 (universal, Release)
        run: |
          set +e
          xcodebuild -project plugin/builds/osx/Vial.xcodeproj -scheme "Vial - VST3" -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error:|fatal error|undefined symbol|\*\*\* " build.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -n -A14 -E "Undefined symbols|duplicate symbol|ld: " build.log | head -60 \
              | cut -c1-300 | while IFS= read -r line; do echo "::error::LD ${line}"; done
            echo "::error::last lines: $(tail -n 8 build.log | tr '\n' '|' | cut -c1-700)"
          fi
          exit $status

      - name: Check for Vital branding and service domains
        run: |
          set +e
          BIN=$(find plugin/builds/osx/build -name "VialSynth" -path "*.vst3/Contents/MacOS/*" | head -1)
          if [ -z "$BIN" ]; then echo "::error::no VST3 binary produced"; exit 1; fi
          file "$BIN"
          strings -a "$BIN" > binary_strings.txt
          if grep -i -n -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel" binary_strings.txt | head -20 > hits.txt && [ -s hits.txt ]; then
            while IFS= read -r l; do echo "::error::[binary] $l"; done < hits.txt
            exit 1
          fi
          echo "branding check passed"

      - name: Package
        run: |
          mkdir -p dist
          VST3=$(find plugin/builds/osx/build -name "VialSynth.vst3" -maxdepth 4 | head -1)
          ditto "$VST3" dist/VialSynth.vst3
          ls -R dist | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-macos-vst3
          path: dist

      - name: Build VialSynth AU (universal, Release)
        run: |
          set +e
          xcodebuild -project plugin/builds/osx/Vial.xcodeproj -scheme "Vial - AU" -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO > au.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error:|fatal error|undefined symbol|\*\*\* " au.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 8 au.log | tr '\n' '|' | cut -c1-700)"
            exit $status
          fi
          mkdir -p dist-au
          AU=$(find plugin/builds/osx/build -name "VialSynth.component" -maxdepth 4 | head -1)
          if [ -z "$AU" ]; then echo "::error::no AU produced"; exit 1; fi
          ditto "$AU" dist-au/VialSynth.component
          lipo -archs dist-au/VialSynth.component/Contents/MacOS/VialSynth
          if strings -a dist-au/VialSynth.component/Contents/MacOS/VialSynth | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the AU"; exit 1; fi
          ls -R dist-au | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-macos-au
          path: dist-au

      - name: Build the CLAP
        run: |
          set -e
          VER=$(sed -n 's/.*kVialFxVersion = "\([^"]*\)".*/\1/p' src/interface/editor_sections/about_section.cpp | head -1)
          git init -q clap-ext
          git -C clap-ext remote add origin https://github.com/free-audio/clap-juce-extensions
          git -C clap-ext fetch -q --depth 1 origin "$CLAP_EXT_SHA"
          git -C clap-ext checkout -q FETCH_HEAD
          git -C clap-ext submodule update -q --init --depth 1 --recursive
          LIB=$(find plugin/builds/osx/build -name "libVialSynth.a" | head -1)
          echo "shared code library: $LIB"
          cmake -S plugin/clap -B clap-build -G Xcode -DCMAKE_BUILD_TYPE=Release \
            -DPATH_TO_CLAP_EXTENSIONS="$PWD/clap-ext" -DVIALSYNTH_SHARED_LIB="$PWD/$LIB" -DVIALSYNTH_VERSION="$VER" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO 2>&1 | tail -30
          set +e
          cmake --build clap-build --config Release --target VialSynth_CLAP > clap.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error:|fatal error|undefined symbol|\*\*\* " clap.log | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 8 clap.log | tr '\n' '|' | cut -c1-700)"
            exit $status
          fi
          mkdir -p dist-clap
          CLAP=$(find clap-build -name "VialSynth.clap" -maxdepth 4 | head -1)
          ditto "$CLAP" dist-clap/VialSynth.clap
          lipo -archs dist-clap/VialSynth.clap/Contents/MacOS/VialSynth
          if strings -a dist-clap/VialSynth.clap/Contents/MacOS/VialSynth | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the CLAP"; exit 1; fi
          ls -R dist-clap | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-macos-clap
          path: dist-clap

      - name: Build the standalone app (universal, Release)
        run: |
          set +e
          xcodebuild -project standalone/builds/osx/Vial.xcodeproj -scheme "Vial - App" -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO > app.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -n -m 40 -E "error:|fatal error|undefined symbol|\*\*\* " app.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 8 app.log | tr '\n' '|' | cut -c1-700)"
            exit $status
          fi
          mkdir -p dist-app
          APP=$(find standalone/builds/osx/build -name "VialSynth.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then echo "::error::no app produced"; exit 1; fi
          ditto "$APP" dist-app/VialSynth.app
          lipo -archs dist-app/VialSynth.app/Contents/MacOS/VialSynth
          if strings -a dist-app/VialSynth.app/Contents/MacOS/VialSynth | grep -i -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel"; then echo "::error::[binary] Vital branding found in the standalone"; exit 1; fi
          ls -R dist-app | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-macos-standalone
          path: dist-app

      - name: Build the macOS installer (.pkg)
        run: |
          VER=$(sed -n 's/.*kVialFxVersion = "\([^"]*\)".*/\1/p' src/interface/editor_sections/about_section.cpp | head -1)
          # One installer, choices the user can switch on and off: VST3, CLAP and AU.
          mkdir -p pkgroot-vst3 pkgroot-clap pkgroot-au pkgs installers
          cp -R dist/VialSynth.vst3 pkgroot-vst3/VialSynth.vst3
          cp -R dist-clap/VialSynth.clap pkgroot-clap/VialSynth.clap
          cp -R dist-au/VialSynth.component pkgroot-au/VialSynth.component
          pkgbuild --root pkgroot-vst3 --identifier com.vialsynth.vst3 --version "$VER" \
            --install-location /Library/Audio/Plug-Ins/VST3 pkgs/vst3.pkg
          pkgbuild --root pkgroot-clap --identifier com.vialsynth.clap --version "$VER" \
            --install-location /Library/Audio/Plug-Ins/CLAP pkgs/clap.pkg
          pkgbuild --root pkgroot-au --identifier com.vialsynth.au --version "$VER" \
            --install-location /Library/Audio/Plug-Ins/Components pkgs/au.pkg
          productbuild --distribution installer/macos/distribution.xml --package-path pkgs "installers/VialSynth-$VER-macOS.pkg"
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: VialSynth-macos-installer
          path: installers
